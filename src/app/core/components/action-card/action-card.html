<div id="action-container" class="card action-panel shadow-sm {{variant()}} overflow-hidden" [class.disabled]="disabled()" (click)="onClick.emit()">
	<div class="card-body d-flex align-items-center">

		<div class="action-icon me-2">
			<fa-icon [icon]="icon()"></fa-icon>
		</div>

		<div class="flex-grow-1 text-start">
			<h5 class="title mb-0">{{ title() }}</h5>
			@if(subtitle()){
				<small class="mt-1">{{subtitle()}}</small>
			}
		</div>

		<div>
			<i class="bi bi-chevron-right"></i>
		</div>

	</div>
</div>
