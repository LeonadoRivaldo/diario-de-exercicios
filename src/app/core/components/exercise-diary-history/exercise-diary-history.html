<!-- HISTÓRICO -->
<div class="mt-3 h-100">
    @if (loading()) {
        <div class="text-muted">Carregando...</div>
    }@else{
        <div class="mb-3 ps-2 pe-2">
            <app-action-card [icon]="newLogIcon()" title="Novo dia" variant="primary" (onClick)="toggleModal(true)"></app-action-card>
        </div>
    }

    <div class="overflow-y-auto ps-2 pe-2" style="height: calc(100% - 75px)">
        @for (e of entries(); track e.id) {
            <div class="card mb-3 shadow-sm">
                <div class="card-body">
                    <div class="row">
                        @if(e.exercises.length > 0 ){
                            <div class="col-md-6">
                                @for (ex of e.exercises; track $index) {
                                    <div>
                                        <strong>{{ ex.name }}</strong>
                                        — {{ ex.value }} {{ ex.type === 'reps' ? 'reps' : 'min' }}
                                        • {{ ex.series }} séries
                                    </div>
                                }
                            </div>
                        }
                        <div class="col-md-6 text-muted">
                            {{ e.notes }}
                        </div>
                        <div class="col-12 d-flex mt-2">
                            <small class="text-muted">
                                {{ e.date | date:'short' }}
                            </small>
                            <div class="ms-auto">
                                <button class="btn btn-sm me-2 btn-outline-danger" (click)="removeEntry(e)">
                                        Apagar
                                </button>
                                <button class="btn btn-sm btn-outline-primary" (click)="editEntry(e)">
                                        Editar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        }
    </div>
</div>

<app-modal [modalTitle]="selectedEntry() ? 'Registro' : 'Novo dia' " [modalOptions]="modalOptions()" [openModal]="openModal()" (modalClosed)="onCloseModal($event)">
    <app-exercise-diary [entry]="selectedEntry()" (onSave)="entrySaved()"></app-exercise-diary>
</app-modal>
