<!-- HISTÓRICO -->
<div class="mt-3">
    @if (loading()) {
        <div class="text-muted">Carregando...</div>
    }@else{
        <div class=" mb-3 ">
            <app-action-card [icon]="newLogIcon()" title="Novo dia" variant="primary" (onClick)="toggleModal()"></app-action-card>
        </div>
    }

    @for (e of entries(); track e.id) {
        <div class="card mb-3 shadow-sm p-3">

            <div class="row">
                <div class="col-md-6">

                    @for (ex of e.exercises; track $index) {
                    <div>
                        <strong>{{ ex.name }}</strong>
                        — {{ ex.value }} {{ ex.type === 'reps' ? 'reps' : 'min' }}
                        • {{ ex.series }} séries
                    </div>
                    }

                </div>

                <div class="col-md-6 text-muted">
                    {{ e.notes }}
                </div>
            </div>

            <div class="d-flex justify-content-between mt-2">
                <small class="text-muted">
                    {{ e.date | date:'short' }}
                </small>

                <button class="btn btn-sm btn-outline-warning"
                        (click)="editEntry(e)">
                    Editar
                </button>

            </div>

        </div>
    }
</div>

<app-modal modalTitle="Novo dia" [modalOptions]="modalOptions()" [openModal]="openModal()" (modalClosed)="onCloseModal($event)">
    @if(selectedEntry(); as entry){
        <app-exercise-diary [entry]="entry"></app-exercise-diary>
    }
</app-modal>
